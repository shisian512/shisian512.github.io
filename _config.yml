# Site settings
title: "Tan Shi Sian | Site Reliability Engineer & Platform Engineer"

email: shisian001@gmail.com

description: >-
  Site Reliability Engineer specializing in OpenShift, Kubernetes,
  observability, DevOps automation, cloud-native platforms, and AI infrastructure.
  Portfolio showcasing enterprise production systems, platform operations,
  automation, and AI-enabled applications.

url: "https://shisian512.github.io"
baseurl: ""

github_username: shisian512

minimal_mistakes_skin: dark
search: true
locale: "en-US"
timezone: Asia/Kuala_Lumpur

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-J4PMZN0ESC"

# SEO
keywords:
  - Site Reliability Engineer
  - Platform Engineer
  - SRE
  - Kubernetes
  - OpenShift
  - DevOps
  - Azure DevOps
  - Observability
  - Cloud Engineering
  - AI Infrastructure
  - MLOps

social:
  type: Person
  name: Tan Shi Sian
  links:
    - https://github.com/shisian512
    - https://www.linkedin.com/in/tan-shi-sian

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

author:
  name: "Tan Shi Sian"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Site Reliability Engineer focused on OpenShift, Kubernetes, observability, DevOps automation, and AI infrastructure."

  links:
    - label: "Portfolio"
      icon: "fas fa-fw fa-globe"
      url: "https://shisian512.github.io"

    - label: "Projects"
      icon: "fas fa-fw fa-folder-open"
      url: "https://shisian512.github.io/projects/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shisian512"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/tan-shi-sian"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:shisian001@gmail.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/shisian512"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
